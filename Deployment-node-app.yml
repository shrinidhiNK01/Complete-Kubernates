apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-node-app
  labels:
    app: node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: shrinidhink01/my-image:04
        ports:
        - containerPort: 80
