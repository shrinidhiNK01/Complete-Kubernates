apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nodedb-app
  labels:
    app: nodedb-app

spec:
  replicas: 2 

  selector:
    matchLabels:
      app: nodedb-app

  template:
    metadata:
      labels:
        app: nodedb-app

    spec:
      containers:
        - name: nodedb-app
          image: shrinidhink01/db-demo-app:01
          ports:
            - containerPort: 3000

        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017

---

apiVersion: v1
kind: Service
metadata:
  name: my-nodedb-app-service      
spec:
  ports:                          
    - protocol: TCP
      port: 8080
      targetPort: 3000            
  selector:                       
    app: nodedb-app               
  type: LoadBalancer      
 